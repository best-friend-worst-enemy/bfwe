<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFWE</title>
    
    <link rel="icon" type="image/png" href="Assets/1-index/icon-color.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --brand-light: #fce8cc;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
            height: 100vh;
            font-family: var(--font-body);
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            object-position: top center;
            z-index: -2; 
            pointer-events: none; 
            filter: brightness(0.7) saturate(0.8); 
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .hero.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .brand-mark {
            width: clamp(198px, 29.67vw, 356px); 
            height: auto;
            transition: opacity 0.3s ease;
        }

        .brand-mark:hover {
            content: url('Assets/1-index/logo-color.gif');
            cursor: pointer;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            max-width: 800px;
        }

        .hero p {
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 1.2vw, 1rem);
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 0;
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            font-family: var(--font-body);
            display: inline-block;
            padding: 18px 45px; 
            text-decoration: none;
            font-weight: 500;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            border: 1px solid var(--brand-gold);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--brand-gold);
            box-shadow: 0 0 20px rgba(217, 156, 69, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-secondary:hover {
            border-color: var(--text-light);
            background-color: rgba(255,255,255,0.1);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: var(--brand-gold);
        }

        .social-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .hero p { font-size: 0.8rem; }
            .btn { padding: 14px 24px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <video id="bg-video" muted playsinline loop>
        <source src="Assets/1-index/index-bg.mp4" type="video/mp4">
    </video>

    <header class="hero" id="hero">
        
        <a href="index.html" class="logo-container">
            <img src="Assets/1-index/logo-white.gif" alt="BFWE Logo" class="brand-mark">
        </a>
        
        <div class="text-content">
            <p>The tobacco industry grew from the dirtiest roots: appropriation, colonization, looting, slavery, exploitation, monopoly, manipulation and continuous lies.</p>
        </div>
        
        <div class="button-group">
            <a href="survey.html" class="btn btn-primary">Participate</a>
            <a href="know-more.html" class="btn btn-secondary">Know More</a>
        </div>

    </header>

    <div class="bottom-bar">
        <a href="https://youtube.com/@bf-we" target="_blank" class="social-link" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            @bf-we
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            var hero = document.getElementById('hero');
            var hasRevealed = false;
            
            video.playbackRate = 0.5;
            
            // Use timeupdate to detect the end of the first playthrough since 'ended' doesn't fire on loop
            video.addEventListener('timeupdate', function() {
                if (!hasRevealed && video.duration > 0 && video.currentTime >= video.duration - 0.2) {
                    hero.classList.add('visible');
                    hasRevealed = true;
                }
            });

            video.play();
        });
    </script>

</body>
</html>
