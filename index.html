<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFWE</title>
    
    <link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/favcon_wht.gif">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --brand-light: #fce8cc;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
            height: 100vh;
            font-family: var(--font-body);
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -2; 
            pointer-events: none; 
            filter: brightness(0.7) saturate(0.8); 
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(5,5,5,0.2) 0%, rgba(5,5,5,0.8) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
            z-index: 1;
        }

        .brand-mark {
            width: clamp(75px, 11.25vw, 135px); 
            height: auto;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 20px rgba(217, 156, 69, 0.4)); 
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .text-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            max-width: 800px;
        }

        .hero p {
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 1.2vw, 1rem);
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 0;
        }

        .ig-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 300;
            transition: color 0.3s ease;
            flex-shrink: 0;
        }

        .ig-link:hover {
            color: var(--brand-gold);
        }

        .ig-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .button-group {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            font-family: var(--font-body);
            display: inline-block;
            padding: 18px 45px; 
            text-decoration: none;
            font-weight: 500;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            border: 1px solid var(--brand-gold);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--brand-gold);
            box-shadow: 0 0 20px rgba(217, 156, 69, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-secondary:hover {
            border-color: var(--text-light);
            background-color: rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .hero p { font-size: 0.8rem; }
            .btn { padding: 14px 24px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/Oja.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>

    <header class="hero">
        
        <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/profile%20color.png" alt="Profile Icon" class="brand-mark">
        
        <div class="text-content">
            <p>Tobacco rise from the dirtiest roots possible: colonization, looting, slavery, exploitation, monopoly, manipulation and most importantly, continuous lies.</p>
            <a href="https://instagram.com/bfme" target="_blank" class="ig-link" aria-label="Instagram">
                <svg class="ig-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                </svg>
                @bfme
            </a>
        </div>
        
        <div class="button-group">
            <a href="know-more.html" class="btn btn-primary">Know More</a>
            <a href="survey.html" class="btn btn-secondary">Survey</a>
        </div>

    </header>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            video.playbackRate = 0.5; 
            
            video.addEventListener('play', function() {
                video.playbackRate = 0.5;
            });
        });
    </script>

</body>
</html>
