<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE Creative Studio</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/favcon_wht.gif">

    <style>
        :root {
            --brand-gold: #d99c45;
            --brand-light: #fce8cc;
            --bg-dark: #0a0a0a;
            --text-light: #f4f4f4;
            --text-muted: #d0d0d0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* --- VIDEO BACKGROUND STYLES --- */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -2; 
            pointer-events: none; 
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 10, 0.65); 
            z-index: -1;
            pointer-events: none;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .nav-logo img {
            height: 60px;
            width: auto;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .nav-links a:hover {
            color: var(--brand-gold);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 120px 5% 60px 5%; 
            position: relative;
            z-index: 1;
        }

        /* --- SCALABLE MAIN AREA --- */
        .hero-text {
            width: 90%; 
            max-width: 850px; 
            background: rgba(10, 10, 10, 0.6); 
            padding: 5vh 5%; 
            border-radius: 20px;
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center; 
        }

        /* --- SCALABLE PROFILE LOGO --- */
        .brand-mark {
            width: clamp(80px, 20%, 200px); 
            height: auto;
            margin-bottom: 3vh;
            display: block;
            transition: width 0.3s ease; 
        }

        .hero-text h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem); 
            line-height: 1.1;
            margin-bottom: 2vh;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero-text h1 span {
            color: var(--brand-gold);
        }

        .hero-text p {
            font-size: clamp(1rem, 1.5vw, 1.3rem);
            color: var(--text-light);
            margin-bottom: 4vh;
            line-height: 1.6;
            max-width: 90%;
        }

        /* --- BUTTON CONTAINER --- */
        .button-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Allows buttons to stack on small screens */
            justify-content: center;
            width: 100%;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px; 
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
            text-align: center;
            min-width: 200px; /* Ensures buttons are a decent size */
        }

        /* Primary Button (Know More) */
        .btn-primary {
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            box-shadow: 0 4px 15px rgba(217, 156, 69, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            background-color: var(--brand-light);
            box-shadow: 0 6px 20px rgba(217, 156, 69, 0.5);
        }

        /* Secondary Button (Survey) */
        .btn-secondary {
            background-color: transparent;
            color: var(--brand-gold);
            border: 2px solid var(--brand-gold);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            background-color: var(--brand-gold);
            color: var(--bg-dark);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .hero-text {
                padding: 40px 20px;
                background: rgba(10, 10, 10, 0.85); 
            }
            
            .hero-text p {
                max-width: 100%;
            }

            .nav-links {
                display: none; 
            }
            
            .nav-logo img {
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- VIDEO BACKGROUND -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/Oja.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <!-- Dark Overlay for readability -->
    <div class="video-overlay"></div>

    <!-- Navigation -->
    <nav>
        <div class="nav-logo">
            <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/logo_lines_wht.gif" alt="BE Animated Logo">
        </div>
        
        <div class="nav-links">
            <a href="#work">Work</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-text">
            <!-- Scalable Profile Logo -->
            <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/profile%20color.png" alt="Profile Icon" class="brand-mark">
            
            <h1>Shaping <span>Ideas</span> Into Reality.</h1>
            <p>We are a multidisciplinary design studio specializing in 3D art, brand identity, and digital experiences. We bring your boldest concepts to life.</p>
            
            <!-- BUTTONS ADDED HERE -->
            <div class="button-group">
                <a href="know-more.html" class="btn btn-primary">Know more</a>
                <a href="https://best-friend-worst-enemy.github.io/bfwe/questionnaire.html" target="_blank" class="btn btn-secondary">Survey</a>
            </div>
            
        </div>
    </header>

    <!-- JAVASCRIPT TO SLOW DOWN THE VIDEO -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            video.playbackRate = 0.5;
            
            video.addEventListener('play', function() {
                video.playbackRate = 0.5;
            });
        });
    </script>

</body>
</html>
