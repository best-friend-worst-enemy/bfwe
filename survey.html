<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey | BFWE</title>
    
    <link rel="icon" type="image/png" href="Assets/1-index/icon-color.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
            height: 100vh;
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            object-position: top center;
            z-index: -2; 
            pointer-events: none; 
            filter: brightness(0.5) saturate(0.8); 
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.9) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .home-btn img {
            height: 40px;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .home-btn img:hover {
            content: url('Assets/1-index/logo-color.gif');
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: var(--brand-gold);
        }

        .social-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .survey-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
        }

        .question-step {
            display: none;
            flex-direction: column;
        }

        .question-step.active {
            display: flex;
        }

        label {
            font-family: var(--font-body);
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: block;
            color: var(--text-light);
            font-weight: 400;
        }

        input[type="email"], input[type="text"], textarea, select {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.3s;
        }

        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--brand-gold);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
            margin: 20px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--brand-gold);
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 24px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            color: var(--text-light);
            cursor: pointer;
            margin-bottom: 0;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--brand-gold);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            align-self: flex-start;
        }

        .btn {
            font-family: var(--font-body);
            padding: 16px 32px;
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: transparent;
            color: var(--brand-gold);
            box-shadow: 0 0 15px rgba(217, 156, 69, 0.2);
        }

        .btn-back {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-back:hover {
            border-color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            box-shadow: none;
        }

        #status {
            margin-top: 20px;
            font-family: var(--font-body);
            color: var(--brand-gold);
            font-weight: 500;
            text-align: center;
            white-space: pre-line;
            line-height: 1.6;
        }

        .home-return-btn {
            display: none;
            margin-top: 30px;
            width: 100%;
            text-align: center;
        }
        
        .location-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="Assets/3-survey/survey-bg.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>

    <div class="top-bar">
        <a href="index.html" class="home-btn">
            <img src="Assets/1-index/logo-white.gif" alt="Home">
        </a>
    </div>

    <div class="survey-container">
        <form id="quizForm" onsubmit="event.preventDefault();">
            
            <!-- Step 0: Disclaimer & Permission -->
            <div class="question-step active" id="step-0">
                <label>Welcome to the BFWE Survey</label>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5;">
                    Placeholder legal disclaimer text. Placeholder explanatory text. We request your permission to use your precise location for this survey. 
                </p>
                <div class="location-options">
                    <button type="button" class="btn" onclick="requestLocationPermission()" id="geoBtn">Allow location</button>
                    <div id="geoStatus" style="font-size: 0.85rem; color: var(--brand-gold); margin-bottom: 10px;"></div>
                </div>
                <div class="btn-group" style="margin-top: 30px;">
                    <button type="button" class="btn" onclick="next(0)">Start</button>
                </div>
            </div>

            <!-- Step 1: Personal Info -->
            <div class="question-step" id="step-1">
                <label>Tell us a bit about yourself.</label>
                <input type="text" name="firstName" id="input-firstName" placeholder="Name" required>
                <input type="text" name="lastName" id="input-lastName" placeholder="Surname" required>
                <select name="gender" id="input-gender" required>
                    <option value="" disabled selected>Select your gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Non-binary">Non-binary</option>
                </select>
                <select name="age" id="input-age" required>
                    <option value="" disabled selected>Select your age group</option>
                    <option value="under 16">under 16</option>
                    <option value="17-25 years">17-25 years</option>
                    <option value="26-35 years">26-35 years</option>
                    <option value="36-45 years">36-45 years</option>
                    <option value="46-55 years">46-55 years</option>
                    <option value="56-65 or more">56-65 or more</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn" onclick="next(1)">Next</button>
                </div>
            </div>

            <!-- Step 2: Relationship -->
            <div class="question-step" id="step-2">
                <label>What is your relationship with tobacco products?</label>
                <select name="relationship" id="input-relationship" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="Smoker">Smoker</option>
                    <option value="Non-Smoker">Non-Smoker</option>
                    <option value="Ex-Smoker">Ex-Smoker</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(2)">Back</button>
                    <button type="button" class="btn" onclick="next(2)">Next</button>
                </div>
            </div>

            <!-- Step 3: Products (Smoker/Ex-Smoker only) -->
            <div class="question-step" id="step-3">
                <label>Which of these products you have experimented?</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="q3_products" value="Industrial Cigarettes"> Industrial Cigarettes</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_products" value="Rolled Tobacco"> Rolled Tobacco</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_products" value="Vapes"> Vapes</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_products" value="Heated Tobacco Sticks"> Heated Tobacco Sticks</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_products" value="Nicotine Pouches"> Nicotine Pouches</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_products" value="Other"> Other</label>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(3)">Back</button>
                    <button type="button" class="btn" onclick="next(3)">Next</button>
                </div>
            </div>

            <!-- Step 4: Age Started (Smoker/Ex-Smoker only) -->
            <div class="question-step" id="step-4">
                <label>At what age did you start?</label>
                <select name="q4_age_started" id="input-q4" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="under 16">under 16</option>
                    <option value="17-25 years">17-25 years</option>
                    <option value="26-35 years">26-35 years</option>
                    <option value="36-45 years">36-45 years</option>
                    <option value="46-55 years">46-55 years</option>
                    <option value="56-65 or more">56-65 or more</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(4)">Back</button>
                    <button type="button" class="btn" onclick="next(4)">Next</button>
                </div>
            </div>

            <!-- Step 5: Craving (Smoker/Ex-Smoker only) -->
            <div class="question-step" id="step-5">
                <label>How strong is your craving to smoke when you wake up?</label>
                <input type="range" name="q5_craving" id="input-q5" min="0" max="10" value="5">
                <div class="slider-labels">
                    <span>None</span>
                    <span>Very strong</span>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(5)">Back</button>
                    <button type="button" class="btn" onclick="next(5)">Next</button>
                </div>
            </div>

            <!-- Step 6: Daily Quantity (Smoker/Ex-Smoker only) -->
            <div class="question-step" id="step-6">
                <label>How many do you have regularly per day?</label>
                <select name="q6_daily" id="input-q6" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="1-10">1-10</option>
                    <option value="11-20">11-20</option>
                    <option value="21-30">21-30</option>
                    <option value="31 or more">31 or more</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(6)">Back</button>
                    <button type="button" class="btn" onclick="next(6)">Next</button>
                </div>
            </div>

            <!-- Step 7: Circle (Smoker/Ex-Smoker only) -->
            <div class="question-step" id="step-7">
                <label>Which of these people are smokers in your circle?</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="q7_circle" value="Mother" class="circle-cb"> Mother</label>
                    <label class="checkbox-label"><input type="checkbox" name="q7_circle" value="Father" class="circle-cb"> Father</label>
                    <label class="checkbox-label"><input type="checkbox" name="q7_circle" value="Siblings" class="circle-cb"> Siblings</label>
                    <label class="checkbox-label"><input type="checkbox" name="q7_circle" value="Partner" class="circle-cb"> Partner</label>
                    <label class="checkbox-label"><input type="checkbox" name="q7_circle" value="Friends" class="circle-cb"> Friends</label>
                    <label class="checkbox-label"><input type="checkbox" name="q7_circle" value="Nobody" id="cb-nobody"> Nobody</label>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(7)">Back</button>
                    <button type="button" class="btn" onclick="next(7)">Next</button>
                </div>
            </div>

            <!-- Step 8: Story (All) -->
            <div class="question-step" id="step-8">
                <label>Now is time for you, to tell us a history of your life related with tobacco. Take your time and put it all out:</label>
                <textarea name="q8_story" id="input-q8" rows="6" placeholder="Placeholder text to be changed later. Placeholder text to be changed later. Placeholder text to be changed later."></textarea>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(8)">Back</button>
                    <button type="button" class="btn" onclick="next(8)">Next</button>
                </div>
            </div>

            <!-- Step 9: Feelings (All) -->
            <div class="question-step" id="step-9">
                <label>Before we finish, please share with us your feelings about smoking and quitting.</label>
                <textarea name="q9_feelings" id="input-q9" rows="4"></textarea>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(9)">Back</button>
                    <button type="button" class="btn" id="submitBtn" onclick="submitForm()">Submit</button>
                </div>
            </div>

        </form>

        <div id="status"></div>
        <div class="home-return-btn" id="home-return">
            <a href="index.html" class="btn">Return to Home</a>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="https://youtube.com/@bf-we" target="_blank" class="social-link" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            @bf-we
        </a>
    </div>

    <script>
        let startTime = Date.now();
        let ipData = { ip: "Unknown", country: "Unknown", city: "Unknown", area: "Unknown" };
        let preciseLocationGranted = false;
        let path = "standard";

        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    ipData.ip = data.ip || "Unknown";
                    ipData.city = data.city || "Unknown";
                }
            }).catch(err => console.log("IP fetch error"));

        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            video.playbackRate = 0.20; 
            
            video.addEventListener('play', function() {
                video.playbackRate = 0.20;
            });
        });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS90ofebzEjhWZY5z1puCBwAuySngjvupETV2KVOZvorkiVfuVN1JLT-erYCk8pqCvJg/exec";

        async function requestLocationPermission() {
            const geoBtn = document.getElementById('geoBtn');
            const geoStatus = document.getElementById('geoStatus');
            
            geoBtn.disabled = true;
            geoBtn.textContent = "Requesting...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        ipData.area = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                        preciseLocationGranted = true;
                        
                        geoStatus.textContent = "Precise location recorded. Finding your country...";
                        geoStatus.style.color = "#d99c45";
                        geoBtn.style.display = 'none';

                        try {
                            const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                            const geoData = await geoRes.json();
                            if (geoData.countryName) {
                                ipData.country = geoData.countryName;
                                if (geoData.city || geoData.locality) {
                                    ipData.city = geoData.city || geoData.locality;
                                }
                                geoStatus.textContent = `Location recorded: ${ipData.country}`;
                            } else {
                                geoStatus.textContent = "Precise location recorded.";
                            }
                        } catch (e) {
                            console.log("Reverse geocode failed", e);
                            geoStatus.textContent = "Precise location recorded. (Country lookup failed)";
                        }
                    },
                    (error) => {
                        console.warn("Location denied or failed:", error);
                        ipData.area = "Location permission denied";
                        geoStatus.textContent = "Permission denied. You can still continue.";
                        geoStatus.style.color = "#c55";
                        geoBtn.disabled = false;
                        geoBtn.textContent = "Allow location";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                geoStatus.textContent = "Geolocation not supported by browser.";
                geoStatus.style.color = "#c55";
                geoBtn.disabled = false;
                geoBtn.textContent = "Allow location";
            }
        }

        function next(currentStep) {
            const currentDiv = document.getElementById('step-' + currentStep);
            const inputs = currentDiv.querySelectorAll('input[required], select[required]');
            
            for (const input of inputs) {
                if (!input.checkValidity()) {
                    input.reportValidity();
                    return;
                }
            }

            // Path logic for Non-Smoker
            if (currentStep === 2) {
                const relationship = document.getElementById('input-relationship').value;
                if (relationship === 'Non-Smoker') {
                    path = "non-smoker";
                    currentDiv.classList.remove('active');
                    document.getElementById('step-8').classList.add('active');
                    return;
                } else {
                    path = "standard";
                }
            }

            currentDiv.classList.remove('active');
            document.getElementById('step-' + (currentStep + 1)).classList.add('active');
        }

        function prev(currentStep) {
            const currentDiv = document.getElementById('step-' + currentStep);
            currentDiv.classList.remove('active');
            document.getElementById('step-' + (currentStep - 1)).classList.add('active');
        }

        const circleCbs = document.querySelectorAll('.circle-cb');
        const nobodyCb = document.getElementById('cb-nobody');

        circleCbs.forEach(cb => {
            cb.addEventListener('change', () => {
                if (cb.checked) nobodyCb.checked = false;
            });
        });

        nobodyCb.addEventListener('change', () => {
            if (nobodyCb.checked) {
                circleCbs.forEach(cb => cb.checked = false);
            }
        });

        function submitForm() {
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            const endTime = Date.now();
            const sessionTimeSeconds = Math.round((endTime - startTime) / 1000);
            
            const circle = [];
            document.querySelectorAll('.circle-cb:checked').forEach(cb => circle.push(cb.value));
            if (nobodyCb.checked) circle.push("Nobody");

            const payload = {
                type: "survey",
                ipData: ipData,
                sessionTime: sessionTimeSeconds,
                userEmail: formData.get('userEmail'),
                firstName: formData.get('firstName'),
                lastName: formData.get('lastName'),
                gender: formData.get('gender'),
                age: formData.get('age'),
                relationship: formData.get('relationship'),
                answers: {
                    q3: formData.getAll('q3_products').join(', '),
                    q4: formData.get('q4_age_started'),
                    q5: formData.get('q5_craving'),
                    q6: formData.get('q6_daily'),
                    q7: circle.join(', '),
                    q8: formData.get('q8_story'),
                    q9: formData.get('q9_feelings')
                }
            };

            const statusDiv = document.getElementById('status');
            statusDiv.textContent = "Submitting...";
            statusDiv.style.color = "#bbbbbb";
            
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain',
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusDiv.textContent = "Thank you for sharing!\nAn email has been sent to\n" + (payload.userEmail || "you");
                statusDiv.style.color = "#d99c45";
                form.style.display = 'none';
                document.getElementById('home-return').style.display = 'block';
            })
            .catch(err => {
                statusDiv.textContent = "Submission failed. Please try again.";
                statusDiv.style.color = "#c55";
                if (submitBtn) submitBtn.disabled = false;
                console.error(err);
            });
        }
    </script>

</body>
</html>
