<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey | BFWE</title>
    
    <link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/favcon_wht.gif">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
            height: 100vh;
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -2; 
            pointer-events: none; 
            filter: brightness(0.5) saturate(0.8); 
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.9) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .home-btn img {
            height: 40px;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .home-btn img:hover {
            content: url('https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/logo_lines_c.gif');
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: var(--brand-gold);
        }

        .social-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .survey-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
        }

        .question-step {
            display: none;
            flex-direction: column;
        }

        .question-step.active {
            display: flex;
        }

        label {
            font-family: var(--font-body);
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: block;
            color: var(--text-light);
            font-weight: 400;
        }

        input[type="email"], input[type="text"], textarea, select {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.3s;
        }

        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--brand-gold);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
            margin: 20px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--brand-gold);
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 24px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            color: var(--text-light);
            cursor: pointer;
            margin-bottom: 0;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--brand-gold);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            align-self: flex-start;
        }

        .btn {
            font-family: var(--font-body);
            padding: 16px 32px;
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: transparent;
            color: var(--brand-gold);
            box-shadow: 0 0 15px rgba(217, 156, 69, 0.2);
        }

        .btn-back {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-back:hover {
            border-color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            box-shadow: none;
        }

        #status {
            margin-top: 20px;
            font-family: var(--font-body);
            color: var(--brand-gold);
            font-weight: 500;
            text-align: center;
            white-space: pre-line;
            line-height: 1.6;
        }

        .home-return-btn {
            display: none;
            margin-top: 30px;
            width: 100%;
            text-align: center;
        }
        
        .location-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/Chalkdog.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>

    <div class="top-bar">
        <a href="index.html" class="home-btn">
            <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/logo_lines_wht.gif" alt="Home">
        </a>
    </div>

    <div class="survey-container">
        <form id="quizForm" onsubmit="event.preventDefault();">
            
            <div class="question-step active" id="step-1">
                <label>What is your email address?</label>
                <input type="email" name="userEmail" id="input-email" required>
                <div class="btn-group">
                    <button type="button" class="btn" onclick="next(1)">Next</button>
                </div>
            </div>

            <div class="question-step" id="step-2">
                <label>Tell us a bit about yourself.</label>
                <input type="text" name="firstName" id="input-firstName" placeholder="First Name" required>
                <input type="text" name="lastName" id="input-lastName" placeholder="Surname" required>
                <select name="age" id="input-age" required>
                    <option value="" disabled selected>Select your age group</option>
                    <option value="under 16">under 16</option>
                    <option value="17 • 25 years">17 • 25 years</option>
                    <option value="26 • 34 years">26 • 34 years</option>
                    <option value="35 • 43 years">35 • 43 years</option>
                    <option value="44 • 52 years">44 • 52 years</option>
                    <option value="53 • over 65 years">53 • over 65 years</option>
                </select>
                <div class="btn-group">
                    <button type="button" class="btn" onclick="next(2)">Next</button>
                </div>
            </div>

            <div class="question-step" id="step-3">
                <label>Question 1: How did you hear about us?</label>
                <input type="text" name="q1" id="input-q1" required>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(3)">Back</button>
                    <button type="button" class="btn" onclick="next(3)">Next</button>
                </div>
            </div>

            <div class="question-step" id="step-4">
                <label>How strong is your craving to smoke when you wake up?</label>
                <input type="range" name="q2_craving" id="input-q2" min="0" max="10" value="5">
                <div class="slider-labels">
                    <span>None</span>
                    <span>Very strong</span>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(4)">Back</button>
                    <button type="button" class="btn" onclick="next(4)">Next</button>
                </div>
            </div>

            <div class="question-step" id="step-5">
                <label>Which of these are smokers in your family?</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="q3_family" value="Mother" class="family-cb"> Mother</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_family" value="Father" class="family-cb"> Father</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_family" value="Other relatives" class="family-cb"> Other relatives</label>
                    <label class="checkbox-label"><input type="checkbox" name="q3_family" value="None" id="cb-none"> None</label>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(5)">Back</button>
                    <button type="button" class="btn" onclick="next(5)">Next</button>
                </div>
            </div>

            <div class="question-step" id="step-6">
                <label>Where are you from?</label>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5;">
                    To get a better understanding of our participants, we need to know where they come from. Please allow your location or select your country.
                </p>
                
                <div class="location-options">
                    <button type="button" class="btn" onclick="requestLocationPermission()" id="geoBtn">Allow location</button>
                    <div id="geoStatus" style="font-size: 0.85rem; color: var(--brand-gold); margin-bottom: 10px;"></div>
                    
                    <select id="input-country">
                        <option value="" disabled selected>Select your country</option>
                        <option value="Afghanistan">Afghanistan</option>
                        <option value="Albania">Albania</option>
                        <option value="Algeria">Algeria</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Australia">Australia</option>
                        <option value="Austria">Austria</option>
                        <option value="Belgium">Belgium</option>
                        <option value="Brazil">Brazil</option>
                        <option value="Canada">Canada</option>
                        <option value="China">China</option>
                        <option value="Denmark">Denmark</option>
                        <option value="Egypt">Egypt</option>
                        <option value="Finland">Finland</option>
                        <option value="France">France</option>
                        <option value="Germany">Germany</option>
                        <option value="Greece">Greece</option>
                        <option value="India">India</option>
                        <option value="Ireland">Ireland</option>
                        <option value="Italy">Italy</option>
                        <option value="Japan">Japan</option>
                        <option value="Mexico">Mexico</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="New Zealand">New Zealand</option>
                        <option value="Norway">Norway</option>
                        <option value="Portugal">Portugal</option>
                        <option value="South Africa">South Africa</option>
                        <option value="Spain">Spain</option>
                        <option value="Sweden">Sweden</option>
                        <option value="Switzerland">Switzerland</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="United States">United States</option>
                    </select>
                </div>

                <div class="btn-group" style="margin-top: 30px;">
                    <button type="button" class="btn btn-back" onclick="prev(6)">Back</button>
                    <button type="button" class="btn" onclick="next(6)">Next</button>
                </div>
            </div>

            <div class="question-step" id="step-7">
                <label>Any additional comments?</label>
                <textarea name="q4" id="input-q4" rows="3"></textarea>
                <div class="btn-group">
                    <button type="button" class="btn btn-back" onclick="prev(7)">Back</button>
                    <button type="button" class="btn" id="submitBtn" onclick="submitForm()">Submit</button>
                </div>
            </div>

        </form>

        <div id="status"></div>
        <div class="home-return-btn" id="home-return">
            <a href="index.html" class="btn">Return to Home</a>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="https://youtube.com/@bf-we" target="_blank" class="social-link" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            @bf-we
        </a>
    </div>

    <script>
        let startTime = Date.now();
        let ipData = { ip: "Unknown", country: "Unknown", city: "Unknown", area: "Unknown" };
        let preciseLocationGranted = false;

        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    ipData.ip = data.ip || "Unknown";
                    ipData.city = data.city || "Unknown";
                }
            }).catch(err => console.log("IP fetch error"));

        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            video.playbackRate = 0.20; 
            
            video.addEventListener('play', function() {
                video.playbackRate = 0.20;
            });
        });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS90ofebzEjhWZY5z1puCBwAuySngjvupETV2KVOZvorkiVfuVN1JLT-erYCk8pqCvJg/exec";

        async function requestLocationPermission() {
            const geoBtn = document.getElementById('geoBtn');
            const geoStatus = document.getElementById('geoStatus');
            
            geoBtn.disabled = true;
            geoBtn.textContent = "Requesting...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        ipData.area = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                        preciseLocationGranted = true;
                        
                        geoStatus.textContent = "Precise location recorded. Finding your country...";
                        geoStatus.style.color = "#d99c45";
                        geoBtn.style.display = 'none';

                        try {
                            const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                            const geoData = await geoRes.json();
                            if (geoData.countryName) {
                                ipData.country = geoData.countryName;
                                if (geoData.city || geoData.locality) {
                                    ipData.city = geoData.city || geoData.locality;
                                }
                                geoStatus.textContent = `Location recorded: ${ipData.country}`;
                            } else {
                                geoStatus.textContent = "Precise location recorded.";
                            }
                        } catch (e) {
                            console.log("Reverse geocode failed", e);
                            geoStatus.textContent = "Precise location recorded. (Country lookup failed)";
                        }
                    },
                    (error) => {
                        console.warn("Location denied or failed:", error);
                        ipData.area = "Location permission denied";
                        geoStatus.textContent = "Permission denied. Please select your country from the list.";
                        geoStatus.style.color = "#c55";
                        geoBtn.disabled = false;
                        geoBtn.textContent = "Allow location";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                geoStatus.textContent = "Geolocation not supported by browser.";
                geoStatus.style.color = "#c55";
                geoBtn.disabled = false;
                geoBtn.textContent = "Allow location";
            }
        }

        function next(currentStep) {
            const currentDiv = document.getElementById('step-' + currentStep);
            const inputs = currentDiv.querySelectorAll('input[required], select[required]');
            
            for (const input of inputs) {
                if (!input.checkValidity()) {
                    input.reportValidity();
                    return;
                }
            }

            if (currentStep === 6) {
                const selectedCountry = document.getElementById('input-country').value;
                
                if (!preciseLocationGranted && !selectedCountry) {
                    alert("Please either select your country from the list or allow precise location.");
                    return;
                }

                if (!preciseLocationGranted && selectedCountry) {
                    ipData.area = selectedCountry;
                    ipData.country = selectedCountry; 
                }
            }

            if (currentStep === 1) {
                document.getElementById('input-email').readOnly = true;
                document.getElementById('input-email').style.opacity = '0.5';
            }

            currentDiv.classList.remove('active');
            document.getElementById('step-' + (currentStep + 1)).classList.add('active');
        }

        function prev(currentStep) {
            const currentDiv = document.getElementById('step-' + currentStep);
            currentDiv.classList.remove('active');
            document.getElementById('step-' + (currentStep - 1)).classList.add('active');
        }

        const checkboxes = document.querySelectorAll('.family-cb');
        const noneCb = document.getElementById('cb-none');

        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                if (cb.checked) noneCb.checked = false;
            });
        });

        noneCb.addEventListener('change', () => {
            if (noneCb.checked) {
                checkboxes.forEach(cb => cb.checked = false);
            }
        });

        function submitForm() {
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            const endTime = Date.now();
            const sessionTimeSeconds = Math.round((endTime - startTime) / 1000);
            
            const family = [];
            document.querySelectorAll('.family-cb:checked').forEach(cb => family.push(cb.value));
            if (noneCb.checked) family.push("None");

            const payload = {
                type: "survey",
                ipData: ipData,
                sessionTime: sessionTimeSeconds,
                userEmail: formData.get('userEmail'),
                firstName: formData.get('firstName'),
                lastName: formData.get('lastName'),
                age: formData.get('age'),
                answers: {
                    q1: formData.get('q1'),
                    q2: formData.get('q2_craving'),
                    q3: family.join(', '),
                    q4: formData.get('q4')
                }
            };

            const statusDiv = document.getElementById('status');
            statusDiv.textContent = "Submitting...";
            statusDiv.style.color = "#bbbbbb";
            
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain',
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusDiv.textContent = "Thank you for sharing!\nAn email has been sent to\n" + payload.userEmail;
                statusDiv.style.color = "#d99c45";
                form.style.display = 'none';
                document.getElementById('home-return').style.display = 'block';
            })
            .catch(err => {
                statusDiv.textContent = "Submission failed. Please try again.";
                statusDiv.style.color = "#c55";
                if (submitBtn) submitBtn.disabled = false;
                console.error(err);
            });
        }
    </script>

</body>
</html>
