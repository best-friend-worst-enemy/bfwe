<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know More | BFWE</title>
    
    <link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/favcon_wht.gif">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            min-height: 100vh;
            font-family: var(--font-body);
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .home-btn img {
            height: 40px;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .home-btn img:hover {
            content: url('https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/logo_lines_c.gif');
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: var(--brand-gold);
        }

        .social-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 120px 5% 120px;
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        .text-container h1 {
            font-family: var(--font-head);
            font-size: clamp(1rem, 2.5vw, 2rem); 
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: -1px;
            text-transform: uppercase;
            text-align: left; 
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: brightness(0.6);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(0.8);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: none;
        }

        .gallery-overlay h2 {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 5, 5, 0.98);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-content {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .modal-image-wrapper {
            flex: 1;
            max-height: 70vh;
        }

        .modal-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-text-wrapper {
            flex: 1;
            color: var(--text-muted);
        }

        .modal-text-wrapper h2 {
            font-family: var(--font-head);
            font-size: 2rem;
            color: var(--text-light);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .modal-text-wrapper p {
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.8;
            font-weight: 300;
        }

        .modal-close-btn {
            margin-top: 40px;
            font-family: var(--font-body);
            display: inline-block;
            padding: 18px 45px; 
            text-decoration: none;
            font-weight: 500;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            white-space: nowrap;
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        .modal-close-btn:hover {
            border-color: var(--text-light);
            background-color: rgba(255,255,255,0.1);
        }

        @media (max-width: 900px) {
            .modal-content {
                flex-direction: column;
                gap: 20px;
            }
            .modal-image-wrapper {
                max-height: 40vh;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="home-btn">
            <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/logo_lines_wht.gif" alt="Home">
        </a>
    </div>

    <div class="content-wrapper">
        <div class="text-container">
            <h1>Get to know us</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openModal('https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/frac%20holder%201.jpeg', 'The Project', 'Tobacco\'s history is deeply entangled with colonization, slavery, and the exploitation of labor. From its early cultivation in the Americas to its global expansion, the industry was built on systems of power and control that prioritized profit over human life.')">
                    <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/frac%20holder%201.jpeg" alt="The Project">
                    <div class="gallery-overlay">
                        <h2>The Project</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/frac%20holder%202.jpeg', 'Tobacco Industry', 'The industry has long relied on manipulation and misinformation. Through aggressive marketing, strategic lobbying, and the deliberate suppression of scientific evidence, tobacco companies have successfully delayed regulation and obscured the true health risks of their products for decades.')">
                    <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/frac%20holder%202.jpeg" alt="Tobacco Industry">
                    <div class="gallery-overlay">
                        <h2>Tobacco Industry</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/fract%20holder%203.jpeg', 'About Us', 'Today, the legacy of continuous lies persists. As new products emerge and old tactics are repackaged, understanding this dark history is essential. We must examine the roots of the industry to fully grasp the ongoing impact it has on public health, global economies, and the environment.')">
                    <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/fract%20holder%203.jpeg" alt="About Us">
                    <div class="gallery-overlay">
                        <h2>About Us</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/frac%20holder%204.jpeg', 'The Survey', 'We want to hear from you. Your perspective is crucial to understanding the dynamics of connection and conflict in our modern world. Participate in our survey and share your insights to help shape the next phase of the project.')">
                    <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/frac%20holder%204.jpeg" alt="The Survey">
                    <div class="gallery-overlay">
                        <h2>The Survey</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="https://youtube.com/@bf-we" target="_blank" class="social-link" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            @bf-we
        </a>
    </div>

    <div class="image-modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-image-wrapper">
                <img id="modalImage" src="" alt="Expanded view">
            </div>
            <div class="modal-text-wrapper">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
            </div>
        </div>
        <button class="modal-close-btn" onclick="closeModal()">Return</button>
    </div>

    <script>
        function openModal(imageSrc, title, description) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = description;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('modalImage').src = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
