<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know More | BFWE</title>
    
    <link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/favcon_wht.gif">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
            height: 100vh;
            font-family: var(--font-body);
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -2; 
            pointer-events: none; 
            filter: brightness(0.5) saturate(0.8); 
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.9) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .home-btn img {
            height: 40px;
            width: auto;
            transition: opacity 0.3s ease;
        }

        .home-btn img:hover {
            opacity: 0.7;
        }

        /* Main Content */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: var(--font-head);
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .hero p {
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 1.2vw, 1rem);
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 50px;
            max-width: 600px;
            line-height: 1.8;
        }

        .btn {
            font-family: var(--font-body);
            display: inline-block;
            padding: 18px 45px; 
            text-decoration: none;
            font-weight: 500;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            white-space: nowrap;
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn:hover {
            border-color: var(--text-light);
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/Oja.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>

    <div class="top-bar">
        <a href="index.html" class="home-btn">
            <img src="https://raw.githubusercontent.com/best-friend-worst-enemy/bfwe/main/logo_lines_wht.gif" alt="Home">
        </a>
    </div>

    <header class="hero">
        <h1>Know More</h1>
        <p>More information about the project is coming soon.</p>
        <a href="index.html" class="btn">Back to Home</a>
    </header>

</body>
</html>
