<!-- know-more.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know More | BFWE</title>
    
    <link rel="icon" type="image/png" href="Assets/1-index/icon-color.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #f28d18;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            min-height: 100vh;
            font-family: var(--font-body);
        }

        body.modal-open {
            overflow: hidden;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: height 0.4s ease;
        }

        .home-btn {
            transition: transform 0.4s ease;
            z-index: 2;
        }

        .home-btn img {
            height: 40px;
            width: auto;
            display: block;
        }

        .home-btn img:hover {
            content: url('Assets/1-index/logo-color.gif');
        }

        .top-bar.expanded {
            height: 140px;
            align-items: flex-start;
            padding-top: 20px;
        }

        .top-bar.expanded .home-btn {
            transform: scale(0.8);
        }

        .modal-bottom-row {
            position: absolute;
            bottom: 20px;
            left: 5%;
            right: 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .top-bar.expanded .modal-bottom-row {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-family: var(--font-head);
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-x:hover {
            color: var(--brand-gold);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: var(--brand-gold);
        }

        .social-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 120px 5% 120px;
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        .text-container h1 {
            font-family: var(--font-head);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: left;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: #000;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
            filter: brightness(0.6);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(0.8);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 15px;
            right: 15px;
            pointer-events: none;
        }

        .gallery-overlay h2 {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay h2 {
            color: var(--brand-gold);
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark); 
            z-index: 50; 
            padding: 200px 5% 120px; 
            overflow-y: auto;
        }

        .image-modal.active {
            display: block;
        }

        .modal-body {
            max-width: 900px;
            margin: 0 auto;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.8;
            font-weight: 500;
        }

        .modal-body p {
            margin-bottom: 20px;
        }

        .modal-body h3 {
            color: var(--text-light);
            font-family: var(--font-head);
            font-size: 1.2rem;
            margin-top: 40px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.6;
        }

        .modal-body img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            display: block;
        }

        .modal-body .caption {
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 30px;
            display: block;
            color: var(--text-muted);
        }

        .modal-body .email-link {
            color: var(--brand-gold);
            text-decoration: none;
        }
        
        .modal-body .email-link:hover {
            text-decoration: underline;
        }

        .fact-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .fact-card {
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .fact-card .stat {
            font-family: var(--font-head);
            font-size: 2rem;
            color: var(--brand-gold);
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .fact-card .desc {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .img-inline-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .img-inline-container.left {
            flex-direction: row;
        }

        .img-inline-container.right {
            flex-direction: row-reverse;
        }

        .img-inline-container img {
            width: 35%;
            margin: 0;
            flex-shrink: 0;
        }

        .img-inline-container p {
            margin: 0;
        }

        .img-side-by-side {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .img-side-by-side img {
            margin: 0;
        }

        .img-centered-small {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .img-centered-small img {
            max-width: 35%;
            margin-bottom: 10px;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .modal-btn {
            font-family: var(--font-body);
            display: inline-block;
            padding: 16px 36px; 
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-outline:hover {
            border-color: var(--text-light);
            background-color: rgba(255,255,255,0.1);
        }

        .btn-primary {
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            border: 1px solid var(--brand-gold);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--brand-gold);
            box-shadow: 0 0 15px rgba(242, 141, 24, 0.3);
        }

        .btn-participate {
            display: none;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .image-modal {
                padding-top: 180px;
            }
            .top-bar.expanded {
                height: 130px;
            }
            .modal-title {
                font-size: 1.2rem;
            }
            .fact-cards {
                grid-template-columns: 1fr;
            }
            .img-side-by-side {
                grid-template-columns: 1fr;
            }
            .img-inline-container {
                flex-direction: column;
            }
            .img-inline-container img {
                width: 100%;
                margin: 0 0 20px 0;
            }
            .img-centered-small img {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar" id="topBar">
        <a href="index.html" class="home-btn">
            <img src="Assets/1-index/logo-white.gif" alt="Home">
        </a>
        
        <div class="modal-bottom-row">
            <h2 class="modal-title" id="modalTitle"></h2>
            <button class="modal-close-x" onclick="closeModal()">×</button>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="text-container">
            <h1>Get to know us</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openModal('concept')">
                    <img src="Assets/2-know-more/1.0-mini.jpeg" alt="Concept">
                    <div class="gallery-overlay">
                        <h2>Concept</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('survey')">
                    <img src="Assets/2-know-more/2.0-mini.jpeg" alt="Survey">
                    <div class="gallery-overlay">
                        <h2>Survey</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('art')">
                    <img src="Assets/2-know-more/3.0-mini.jpeg" alt="Art">
                    <div class="gallery-overlay">
                        <h2>Art</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('about')">
                    <img src="Assets/2-know-more/4-mini.jpeg" alt="About Us">
                    <div class="gallery-overlay">
                        <h2>About Us</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="https://youtube.com/@bf-we" target="_blank" class="social-link" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            @bf-we
        </a>
    </div>

    <div class="image-modal" id="imageModal">
        <div class="modal-body" id="modalBody">
            <!-- Content injected here -->
        </div>
        <div class="modal-footer">
            <a href="survey.html" class="modal-btn btn-primary btn-participate" id="modalParticipateBtn">Participate</a>
            <button class="modal-btn btn-outline" onclick="closeModal()">Return</button>
        </div>
    </div>

    <script>
        const content = {
            concept: {
                title: "Concept",
                body: `
                    <p>More than 7 million people each year are killed by tobacco. This industry denies full responsibility for creating products that cause death for half of its users, and diseases for many more. It compensates by offering PR crumbles, shy mea culpas and by creating new so-called ‘less harmful’ products.</p>
                    
                    <p>Cigarettes were broadly rejected in high income countries in the 1990s/2000s, but the industry continues to create new products to keep old and new customers addicted. It bypasses laws by selling “devices” and new nicotine based products, often to children.</p>
                    
                    <div class="fact-cards">
                        <div class="fact-card">
                            <span class="stat">7 MILLION+</span>
                            <span class="desc">People die each year from tobacco use</span>
                        </div>
                        <div class="fact-card">
                            <span class="stat">$1.85 TRILLION</span>
                            <span class="desc">Global economic damage caused by smoking each year</span>
                        </div>
                        <div class="fact-card">
                            <span class="stat">79%</span>
                            <span class="desc">of the world's smokers are in low and middle income countries</span>
                        </div>
                    </div>
                    
                    <p>Heated tobacco burners and sticks, vapes (e-cigarettes) and their pods, and nicotine pouches are industry responses aimed at generations that have rejected the habit of smoking cigarettes. But all products of the tobacco industry are designed to keep poisoning people while keeping them addicted to the poisons.</p>
                    
                    <img src="Assets/2-know-more/1.2-hist.jpg" alt="Archer's Virginia">
                    
                    <p>Smokers are often seen as people without self-control, as inconvenient to their surroundings, likewise pitied and portrayed as edgy or risky individuals. They hold the psychological and emotional burdens of their relationship with tobacco. Smokers are strategically convinced that their addiction results from their own choices, while precise industry manipulations keep people hooked on one of the deadliest drugs in history.</p>
                    
                    <div class="img-centered-small">
                        <img src="Assets/2-know-more/1.3-ns.jpg" alt="Need Smokes">
                    </div>
                    
                    <p>Understanding, awareness and support, often comes from people who have suffered, directly or indirectly, from the harms caused by the tobacco industry. From people who envision a future where these products no longer ruin lives at scale.</p>
                `
            },
            survey: {
                title: "Survey",
                body: `
                    <p>Our goal is to make compelling artwork with your help, and this survey aims to learn about your relationship with tobacco or nicotine. We want to hear your story, whether you’re a non-smoker, casual, regular or ex-smoker. We’ll survey widely, then fuse, combine and select stories to transform into abstract portraits. Your story will be part of an art project to be presented in the coming months.</p>
                    
                    <img src="Assets/2-know-more/2.1-survey.jpeg" alt="Survey Image">
                    
                    <p>This is a quick survey that will take you less than 5 minutes for the standard questions, but we encourage you to take your time to tell your story. Try to be broad, express your feelings and share your story, knowing that your contribution will remain anonymous.</p>
                    
                    <p>All survey participants will be kept informed of our progress and some will be invited for further interviews.</p>
                    
                    <p>Click on the button below and help us to fight against the tobacco industry.</p>
                `
            },
            art: {
                title: "Art",
                body: `
                    <img src="Assets/2-know-more/3.1-header.jpeg" alt="Art Background">
                    
                    <h3>"The more frightening the world becomes,<br>the more art becomes abstract"<br>Wassily Kandinsky</h3>
                    
                    <p>The main description of abstraction is to communicate the maximum possible using the least resources available. Bringing the viewer to an unknown environment, using their perception and imagination gives the possibility of interpretation without leaving aside the art iconography.</p>
                    
                    <p>Using abstraction for anonymity and as a liberating media, we ensure that participants are able to openly share their stories, feelings and quitting plans without revealing identities. It provides an opportunity to express, without prejudice, fear of consequence and while experiencing a safe environment.</p>
                    
                    <p>Abstraction, as an art concept, often directly connects with famous paintings portrayed by masters such as Picasso, Miró, Kandinsky or even Calder’s kinetic mobiles. There are only a few artists working exclusively with 3D abstract art and most are focused on digital creation for physical applications, as beautifully done lately by Jesse Kanda, Wieki Somers, Stephanie Lempert and others.</p>
                    
                    <div class="img-centered-small">
                        <img src="Assets/2-know-more/3.2-kandinsky.jpg" alt="Kandinsky">
                        <span class="caption">"To the unknown voice" • 1916 • Kandinsky watercolor to Nina Andreevskaya, after falling in love with the voice on the phone, who became his wife one year later.</span>
                    </div>
                    
                    <p>The first visual concept of this project comes from a digital art assignment from a university study. It consisted of creating political portraits, using multiple published pictures of these figures, and assembling them as a deformed photo collage with likeness abstraction to convey the misleading influences perpetuated by politicians.</p>
                    
                    <div class="img-side-by-side">
                        <img src="Assets/2-know-more/3.3-obama.jpeg" alt="Obama Politricks">
                        <img src="Assets/2-know-more/3.4-putin.jpeg" alt="Putin Politricks">
                    </div>
                    
                    <p>This concept stayed dormant for many years, until my self taught 3D modeling and animation studies started. My passion for shapes and colors, combined with the possibility to turn them into portraits, allows me to describe a person's features, particularities and stories, while keeping the viewer intrigued by not knowing their full identity.</p>
                    
                    <p>Working with 3D modeling software provides tools that can automate the process at the cost of lack of control. I don’t use AI in art creation, but in my approach I use 3D software as a virtual studio space where I can create basic forms, manipulate, shatter these forms in multiple random shapes and assemble them back into still or animated portraits. The results of this creation are images to be printed, animated and projected.</p>
                    
                    <div class="img-centered-small">
                        <img src="Assets/2-know-more/3.5-smoker.jpeg" alt="Deconstructed Portrait" style="max-width: 45%;">
                    </div>
                    
                    <p>To complement and create ambiguity, we plan to use traditional paper collage mixed with sculptural depth to enrich the difference between the person affected and the tobacco industry responsible for this chain of lies and harm.</p>
                    
                    <p>The ambition for the first showcase is to create space and representation of people's stories and inspire compelling reactions from their audience.</p>
                `
            },
            about: {
                title: "About Us",
                body: `
                    <p>We are a group of professionals using science, information and art to shed light on the tobacco industry's manipulative tactics. Our goal is to inform people about these heavily engineered industry schemes, tobacco consumption harms, smokers addiction relationship and regular people's perception of it.</p>
                    
                    <p>Our group is made of artists, scientists and entities working on the subject of tobacco consumption, regulation and control. We are always open for new contributors, taking in consideration that the whole project is focused on the survey participants' stories, we are keen for people with different perspectives on the subject.</p>
                    
                    <p>We encourage you to participate on our survey, watch our videos on Youtube, share with others and if you feel like taking action, please send us a message on our email <a href="mailto:bxl.proj@gmail.com" class="email-link">bxl.proj@gmail.com</a></p>
                    
                    <p>Thank you!</p>
                `
            }
        };

        function openModal(key) {
            const data = content[key];
            if (!data) return;
            
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalBody').innerHTML = data.body;
            
            const participateBtn = document.getElementById('modalParticipateBtn');
            if (key === 'survey') {
                participateBtn.style.display = 'inline-block';
            } else {
                participateBtn.style.display = 'none';
            }
            
            document.getElementById('imageModal').classList.add('active');
            document.getElementById('topBar').classList.add('expanded');
            document.body.classList.add('modal-open'); 
            
            document.getElementById('imageModal').scrollTop = 0;
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('topBar').classList.remove('expanded');
            document.body.classList.remove('modal-open'); 
            document.getElementById('modalBody').innerHTML = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
