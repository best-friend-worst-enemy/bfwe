<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know More | BFWE</title>
    
    <link rel="icon" type="image/png" href="Assets/1-index/icon-color.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Pinyon+Script&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-gold: #d99c45;
            --bg-dark: #050505;
            --text-light: #ffffff;
            --text-muted: #bbbbbb;
            --font-head: 'Dela Gothic One', sans-serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Sono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            min-height: 100vh;
            font-family: var(--font-body);
        }

        body.modal-open {
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: height 0.4s ease;
        }

        .home-btn {
            transition: transform 0.4s ease;
            z-index: 2;
        }

        .home-btn img {
            height: 40px;
            width: auto;
            display: block;
        }

        .home-btn img:hover {
            content: url('Assets/1-index/logo-color.gif');
        }

        .top-bar.expanded {
            height: 140px;
            align-items: flex-start;
            padding-top: 20px;
        }

        .top-bar.expanded .home-btn {
            transform: scale(0.8);
        }

        .modal-bottom-row {
            position: absolute;
            bottom: 20px;
            left: 5%;
            right: 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .top-bar.expanded .modal-bottom-row {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-family: var(--font-head);
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .modal-close-x {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s ease;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-x:hover {
            color: var(--brand-gold);
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 1vw, 0.9rem);
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: var(--brand-gold);
        }

        .social-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Main Content */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 120px 5% 120px;
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        .text-container h1 {
            font-family: var(--font-head);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: -1px;
            text-transform: uppercase;
            text-align: left;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: #000;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
            filter: brightness(0.6);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: brightness(0.8);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 15px;
            right: 15px;
            pointer-events: none;
        }

        .gallery-overlay h2 {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay h2 {
            color: var(--brand-gold);
        }

        /* Modal Content Area */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark); 
            z-index: 50; 
            padding: 200px 5% 120px; 
            overflow-y: auto;
        }

        .image-modal.active {
            display: block;
        }

        .modal-body {
            max-width: 900px;
            margin: 0 auto;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.8;
            font-weight: 300;
        }

        .modal-body p {
            margin-bottom: 20px;
        }

        .modal-body h3 {
            color: var(--text-light);
            font-family: var(--font-head);
            font-size: 1.2rem;
            margin-top: 40px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }

        .modal-body img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            display: block;
        }

        .modal-body .caption {
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
            margin-top: -10px;
            margin-bottom: 30px;
            display: block;
            color: var(--text-muted);
        }

        .modal-body .email-link {
            color: var(--brand-gold);
            text-decoration: none;
        }
        
        .modal-body .email-link:hover {
            text-decoration: underline;
        }

        /* Image Layout Classes from DOCX */
        .img-side-by-side {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .img-side-by-side img {
            margin: 0;
        }

        .img-small-left {
            float: left;
            width: 35%;
            margin-right: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .img-small-right {
            float: right;
            width: 35%;
            margin-left: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .modal-btn {
            font-family: var(--font-body);
            display: inline-block;
            padding: 16px 36px; 
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn-outline:hover {
            border-color: var(--text-light);
            background-color: rgba(255,255,255,0.1);
        }

        .btn-primary {
            background-color: var(--brand-gold);
            color: var(--bg-dark);
            border: 1px solid var(--brand-gold);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--brand-gold);
            box-shadow: 0 0 15px rgba(217, 156, 69, 0.3);
        }

        .btn-participate {
            display: none;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .image-modal {
                padding-top: 180px;
            }
            .top-bar.expanded {
                height: 130px;
            }
            .modal-title {
                font-size: 1.2rem;
            }
            .img-side-by-side {
                grid-template-columns: 1fr;
            }
            .img-small-left, .img-small-right {
                float: none;
                width: 100%;
                margin: 20px 0;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar" id="topBar">
        <a href="index.html" class="home-btn">
            <img src="Assets/1-index/logo-white.gif" alt="Home">
        </a>
        
        <div class="modal-bottom-row">
            <h2 class="modal-title" id="modalTitle"></h2>
            <button class="modal-close-x" onclick="closeModal()">×</button>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="text-container">
            <h1>Get to know us</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openModal('concept')">
                    <img src="Assets/2-know-more/1.0-mini.jpeg" alt="Concept">
                    <div class="gallery-overlay">
                        <h2>Concept</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('survey')">
                    <img src="Assets/2-know-more/2.0-mini.jpeg" alt="Survey">
                    <div class="gallery-overlay">
                        <h2>Survey</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('art')">
                    <img src="Assets/2-know-more/3.0-mini.jpeg" alt="Art">
                    <div class="gallery-overlay">
                        <h2>Art</h2>
                    </div>
                </div>

                <div class="gallery-item" onclick="openModal('about')">
                    <img src="Assets/2-know-more/4-mini.jpeg" alt="About Us">
                    <div class="gallery-overlay">
                        <h2>About Us</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <a href="https://youtube.com/@bf-we" target="_blank" class="social-link" aria-label="YouTube">
            <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            @bf-we
        </a>
    </div>

    <div class="image-modal" id="imageModal">
        <div class="modal-body" id="modalBody">
            <!-- Content injected here -->
        </div>
        <div class="modal-footer">
            <a href="survey.html" class="modal-btn btn-primary btn-participate" id="modalParticipateBtn">Participate</a>
            <button class="modal-btn btn-outline" onclick="closeModal()">Return</button>
        </div>
    </div>

    <script>
        const content = {
            concept: {
                title: "Concept",
                body: `
                    <p>The tobacco industry grew from dirty roots: appropriation, colonization, looting, slavery, exploitation, monopoly, manipulation and continuous lies.</p>
                    
                    <p>After almost 150 years of brainwashing, viciousness and corruption, the tobacco industry nowadays kills more than 7 million people per year from various diseases associated with these products. It remains active and more insidious than when it started, mysteriously selling more even after being restricted by public health control measures such as: mass communication campaigns, prohibitions, taxation, point of sale restrictions and packaging health warnings. In a strange way, tobacco consumption keeps rising as societies acknowledge the harms of this habit. And while public health approaches limit industry actions, the industry finds new ways to entice.</p>
                    
                    <img src="Assets/2-know-more/1.1-tkf.png" alt="Tobacco Free Kids">
                    
                    <p>Limitations become creative guidelines for this sordid business. After experiencing falls in revenues and health related controls, the tobacco industry has rediscovered itself in today's technological boom. Finding ways to bypass law by selling "devices" and resuscitating unfashionable ways to sell nicotine based products. Heated tobacco burners and sticks, cigarettes (aka vapes) and their refills, disposable pods and tobacco/nicotine pouches, are the rapid response for a generation that has started rejecting smoking as a habit, but is now enthralled by a new brainwashing campaigning game played by this deadly industry.</p>
                    
                    <p>Tobacco use began as an ingenuous nature finding as early as xxx. It became indigenous ritualistic herb and ancient medicine to alleviate strong pain in specific and controlled circumstances. As with many indigenous practices, tobacco use was stolen by colonizers. From the xxx It was used as fuel for slavery, manipulated to be a royalty exclusive feeding segregation, and promoted as universal medicine by unethical doctors. By xxx, tobacco production and use became one of the main motors of the industrial revolution; it was monopolized to dominate societies and markets. In the 1900s, tobacco was included in the basic ration for soldiers in both world wars from USA, UK ?? In concert, tobacco was marketed as a character standard for men, and for overcoming soft taboo for women. By the 1950s? tobacco had become a symbol of success for the nuclear family in xxx, xx, with chocolate cigars designed as treats for kids. Tobacco became a financier of public relations as a science by opportunists. It was the main subject on the rise of advertising empires, becoming a controversial primary source of income for athletes by xxx. Traditional tobacco use (cigarettes) were broadly rejected by a new generation of users in high income countries in the 1990s/2000s. Now, tobacco is becoming a symbol of technological evolution under another industry engineered plot.</p>
                    
                    <img src="Assets/2-know-more/1.2-hist.jpg" alt="Archer's Virginia">
                    
                    <p>The old tobacco industry grew from the dirtiest roots possible and its fruits are still poisoned.</p>
                    
                    <div class="clearfix">
                        <img src="Assets/2-know-more/1.3-ns.jpg" alt="Need Smokes" class="img-small-left">
                        <p>Smokers are still mainly seen by society as stigmatized people who have no self-control on its cravings, inconvenient to their surroundings, sometimes pitied as edgy and risky individuals that in reality, are very precisely manipulated by the industry, to start with fun smoking and once hooked, continue addicted on consuming one of the deadliest drugs in humankind history.</p>
                    </div>
                    
                    <p>In the meantime, the tobacco monopoly thrives with no harm and is praised as society's untouchable economic pillar. The few companies that dominated the world tobacco market, keep denying its responsibilities for users' diseases and deaths, throwing a few support crumbles and very shy mea culpa from time to time, just to incessantly continue profiting. Although users are kept being marginalized, judged, guilted and worst of all, left shut and defenseless since they are strategically convinced that their addiction is a result of their own choices.</p>
                    
                    <p>Collectively left alone, smokers have to bear individually, all the psychological and emotional load of not being able to tell their stories and emotions without the prejudice that comes with it. Numbing with a comfortable addiction, the shame and taboo to fight while struggling to overcome the industrialized and tailored business method. Since the beginning of this industry, the key was to invest money and research to keep the buyer addicted, but much as nothing to mitigate the damage. Understanding, awareness and support, mostly comes from people who suffered, direct or indirect from smoking, but see a future where these products are no longer harming people.</p>
                    
                    <p>We aim to create a safe channel for these individuals to tell their stories, share their angst, experiences and feelings related to what is to live in or surrounded by a constant addiction battle. Strong representation, anonymity, free and secure space to share their deepest feelings bringing awareness to other people and breaking the prejudice by incentivizing a way out, is the main goal of this project. We are keen to understand, broadcast, support and, if possible, use these feelings as billboards to do justice to the industry's multiple imposed attacks on society.</p>
                    
                    <div class="clearfix">
                        <img src="Assets/2-know-more/1.4-rossini.jpeg" alt="Rossini Profile" class="img-small-right">
                        <p>After 28 years as a heavy smoker, there were moments where a cigarette felt like my only reliable friend, but in reality it was my worst enemy. Even in the happy moments, I always hid myself in my addiction, letting it dictate my choices. Alone, I've managed to quit many other drug addictions and nowadays, I'm on my third quitting attempt over the last 2 years. I feel the need to help other people to understand their situation, be in control and with the necessary clarity of how this addiction is not our fault or weakness, but a heavy engineering manipulation campaign by the greedy tobacco industry.</p>
                    </div>
                `
            },
            survey: {
                title: "Survey",
                body: `
                    <p>The sole purpose of this survey is to get to know people's relationship with tobacco whether they are non- smokers, casual or regular smokers or even ex- smokers. This information combined with their personal relationship with tobacco, will be part of an art project to be presented soon. Initially we are making as many interviews as possible, gathering stories, selecting the interesting ones and soon they'll be transformed into 3D abstract portraits to tell people's feelings.</p>
                    
                    <img src="Assets/2-know-more/2.1-oja-compared.png" alt="Survey Background">
                    
                    <p>We live in times where information is a big currency, however we have no interest in using the gathered information for any other purpose than the artwork creation and under requested user permission, the exhibition later. Our goal is to make beautiful artwork with your help, but all selected participants will be prior notified about their selection and invited to a further interview and participation. All the information gathered will be covered by the GPDR law, allowing the participants to retrieve their data, set the level of use and cancel the use permission at any moment.</p>
                    
                    <p>This is a quick survey, less than 5 minutes for the standard questions, but you can take your time to tell your history with as many details as possible. We encourage you to be specific, focus on the details and be free to express your feelings, considering that your contribution will remain anonymous and no one, but the artist, will read your history.</p>
                    
                    <p>Click on the button below, tell your history and help us to fight against the tobacco industry.</p>
                `
            },
            art: {
                title: "Art",
                body: `
                    <img src="Assets/2-know-more/3.1-header.jpeg" alt="Art Background">
                    
                    <h3>"The more frightening the world becomes, the more art becomes abstract" Wassily Kandinsky</h3>
                    
                    <p>The main description of abstraction is the ability to communicate the maximum possible with the least amount of resources available. Bringing the viewer to an unknown environment using their power of perception and interacting with their imagination, opens the possibility of interpretation without leaving aside the art iconography.</p>
                    
                    <p>Having abstraction as a resource for anonymity and as liberating media, we can ensure that participants will be able to openly share their stories, feelings and quitting plans without any prejudice. They need to have a chance to tell anything, without fearing any consequences and experiencing the outlet power of a safe environment.</p>
                    
                    <p>When people think about abstraction as an art concept, the direct connection is with the famous paintings portrayed by masters such as Picasso, Miró, Kandinsky or even Calder's kinetic mobiles. There are only a few artists working exclusively with 3D abstract art and most of them are focused on digital creation for physical applications, as beautifully done lately by Jesse Kanda, Wieki Somers, Stephanie Lempert and others.</p>
                    
                    <img src="Assets/2-know-more/3.2-kandinsky.jpg" alt="Kandinsky">
                    <span class="caption">"To the unknown voice" • 1916 • Kandinsky watercolor to Nina Andreevskaya, after falling in love with the voice on the phone, who became his wife one year later.</span>
                    
                    <p>The first visual concept of this project, is a derivative of a digital art assignment from when I was in university, that consisted in creating political portraits using multiple published pictures of these figures and assembling them as deformed likeness, in order to convey all the misleading that these politicians perpetuate. It started as a mix of photo collage with likeness abstraction (examples above). This concept stayed dormant for many years, until my self taught 3D modeling and animation studies developed. The passion for shapes and colors, combined with the possibility to turn them into portraits, allow me to describe a person's features, particularities and stories keeping the viewer intrigued by not knowing who is the interlocutor.</p>
                    
                    <div class="img-side-by-side">
                        <img src="Assets/2-know-more/3.3-obama.jpeg" alt="Obama Politricks">
                        <img src="Assets/2-know-more/3.4-putin.jpeg" alt="Putin Politricks">
                    </div>
                    
                    <p>Working with 3D modeling softwares, provides tools that can automate the process at the cost of lack of control. Similar to the contemporary AI art experiments, the artists have creation resources at the expense of an unknown and many times, uncontrolled output. In my approach, I've used the software as a virtual studio space where I can create basic forms, manipulate, shatter these forms in multiple random shapes and assemble it back into still or animated portraits.</p>
                    
                    <img src="Assets/2-know-more/3.5-smoker.jpeg" alt="Deconstructed Portrait" class="img-small-right">
                    
                    <p>At first glance, the main results of this creation process are still images to be printed in paper, however with the adventure of actual technologies, these artworks can be conveyed into animations, projected, 3D printed, mixed reality environments, extruded, etched and depending on the available resources, even holographically displayed. The ambition for the first showcase is more to create the space and representation of people's stories than promoting the art craft itself. The more resources and technologies that we can allocate for this exhibition, the more compelling the viewer might react.</p>
                    
                    <div style="clear: both;"></div>
                    
                    <img src="Assets/2-know-more/3.6-oja.png" alt="Oja" style="width: 100%; max-width: 600px; margin: 20px auto;">

                    <p>To complement and create ambiguity to the main technique, and returning to the original assignment idea, I plan to use traditional paper collage mixed with sculptural depth to enrich the difference between the interlocutor affected and the tobacco industry responsible for this chain of lies and harm.</p>
                    
                    <p>With all my love, Rossini Fernandes</p>
                `
            },
            about: {
                title: "About Us",
                body: `
                    <p>We are a group of professionals using science, information and art to shed light on the tobacco industry's manipulative tactics. Our goal is to inform people about these heavily engineered industry schemes, tobacco consumption harms, smokers addiction relationship and regular people's perception of it.</p>
                    
                    <p>Our group is made of artists, scientists and entities working on the subject of tobacco consumption, regulation and control. We are always open for new contributors, taking in consideration that the whole project is focused on the survey participants' stories, we are keen for people with different perspectives on the subject.</p>
                    
                    <p>We encourage you to participate on our survey, watch our videos on Youtube, share with others and if you feel like taking action, please send us a message on our email <a href="mailto:bxl.proj@gmail.com" class="email-link">bxl.proj@gmail.com</a></p>
                    
                    <p>Thank you!</p>
                `
            }
        };

        function openModal(key) {
            const data = content[key];
            if (!data) return;
            
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalBody').innerHTML = data.body;
            
            const participateBtn = document.getElementById('modalParticipateBtn');
            if (key === 'survey') {
                participateBtn.style.display = 'inline-block';
            } else {
                participateBtn.style.display = 'none';
            }
            
            document.getElementById('imageModal').classList.add('active');
            document.getElementById('topBar').classList.add('expanded');
            document.body.classList.add('modal-open'); 
            
            document.getElementById('imageModal').scrollTop = 0;
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('topBar').classList.remove('expanded');
            document.body.classList.remove('modal-open'); 
            document.getElementById('modalBody').innerHTML = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
